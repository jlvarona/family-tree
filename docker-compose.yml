# Local development dependencies only. Production runs on RDS PostgreSQL and a
# deployed Keycloak instance (see ARCHITECTURE.md). Both services here exercise
# the same protocols the server talks to in production: real Postgres wire
# protocol and a real OIDC authorization-code flow, not a bypass/stub.
#
# The postgres service is optional: if you already run a shared Postgres
# container for another project (same host port 5432), skip `docker compose up
# postgres` entirely and point this project at a new database/role on that
# instance instead -- see README.md "Setting up the database" for the exact
# commands. Starting this service while another container already holds 5432
# will just fail to bind the port.
#
# FT-064: the published host ports can be moved instead, so this stack runs next to
# another project's. Set them in your shell (or a git-ignored .env next to this file):
#   FAMILY_TREE_POSTGRES_PORT   host port for Postgres  (default 5432)
#   FAMILY_TREE_KEYCLOAK_PORT   host port for Keycloak  (default 8081)
# Unset or empty means the default. Only the host side changes; the containers still
# listen on 5432 and 8080. A different Keycloak port changes the token issuer, so the
# server's DB_URL / OIDC_ISSUER and the web client's config.json issuer must follow
# (README "Using other host ports").

services:
  postgres:
    image: postgres:16
    container_name: family-tree-postgres
    environment:
      POSTGRES_DB: family_tree
      POSTGRES_USER: family_tree
      POSTGRES_PASSWORD: family_tree
    ports:
      - "${FAMILY_TREE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - family-tree-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_tree"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: family-tree-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "${FAMILY_TREE_KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./ops/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  # FT-008: a local S3-compatible photo store, so presigned uploads and downloads can
  # be verified without AWS. SeaweedFS `weed mini` checks SigV4 signatures, keeps the
  # bucket private and supports bucket CORS through the S3 API. Published on loopback
  # only. The credentials come from your shell (README "Photo storage"); nothing is
  # stored in this file. With S3_BUCKET set the bucket is created on start; the API
  # server puts the browser CORS rules on it when MEDIA_S3_CREATE_BUCKET=true.
  #
  # Opt-in: only `docker compose --profile media up -d s3` starts it, so the usual
  # `docker compose up -d` (Postgres, Keycloak) doesn't. Without credentials SeaweedFS
  # would run with no authentication at all, so the entry point below refuses to start
  # unless both are set. The check runs in the container (`$$` keeps Compose from
  # interpolating it), so a missing variable never breaks the other services.
  s3:
    image: ghcr.io/chrislusf/seaweedfs:4.54
    container_name: family-tree-s3
    profiles: ["media"]
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$${AWS_ACCESS_KEY_ID}" ] || [ -z "$${AWS_SECRET_ACCESS_KEY}" ]; then
          echo "family-tree-s3: set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY (local-only values) before starting; refusing to run without authentication" >&2
          exit 1
        fi
        exec /entrypoint.sh mini -dir=/data
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${MEDIA_S3_BUCKET:-family-tree-media}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - family-tree-s3-data:/data

volumes:
  family-tree-postgres-data:
  family-tree-s3-data:
